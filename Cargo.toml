[package]
name = "webdav-backup"
version = "0.1.6"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
reqwest_dav = "0.3"
serde = { version = "1.0", features = ["derive"] }
sevenz-rust2 = { version = "0.21", default-features = false, features = [
    "aes256",
    "compress",
    "util",
] }
thiserror = "2.0"
tokio = { version = "1.52", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }
toml = "1.1"

[profile.release]
strip = true
incremental = true
