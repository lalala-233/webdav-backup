[package]
name = "webdav-backup"
version = "0.1.5"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest_dav = "0.3"
serde = { version = "1.0", features = ["derive"] }
sevenz-rust2 = "0.21"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.52", features = ["full"] }
toml = "1.1"

[profile.release]
strip = true
incremental = true